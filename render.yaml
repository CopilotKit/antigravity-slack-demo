# Two services. Slack never reaches either directly: events go to CopilotKit
# Intelligence, and the worker dials out to it, so neither needs public ingress.
services:
  # The agent. Private: only the worker calls it, over Render's internal network.
  - type: pserv
    name: antigravity-agent
    runtime: docker
    repo: https://github.com/copilotkit/internal-antigravity-slack-channel
    region: oregon
    plan: starter
    dockerfilePath: ./agent/Dockerfile
    dockerContext: ./agent
    # A disk pins this to one instance, which is what we want anyway: sessions
    # live in memory and a parked coroutine cannot be serialized or moved.
    disk:
      name: antigravity-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      # chat | readonly | full. Demote here to disarm the shell without a code
      # change.
      - key: AGENT_TOOLS
        value: full
      # Off: tools run unattended. With AGENT_TOOLS=full that is unguarded
      # shell for anyone who can mention the bot. Set true once the agent emits
      # the CUSTOM events the channel's onInterrupt handlers listen for.
      - key: AGENT_TOOL_APPROVAL
        value: "false"
      - key: AGENT_MODEL
        value: gemini-3.6-flash
      # Short on purpose: the model garbles long paths when echoing them into a
      # tool call, and the harness treats a bad path as fatal.
      - key: AGENT_WORKSPACE
        value: /data/ws
      - key: AGENT_SAVE_DIR
        value: /data/save

  # The channel worker.
  - type: worker
    name: antigravity-channel
    runtime: docker
    repo: https://github.com/copilotkit/internal-antigravity-slack-channel
    region: oregon
    plan: starter
    dockerfilePath: ./channel/Dockerfile
    dockerContext: ./channel
    envVars:
      - key: COPILOTKIT_API_KEY
        sync: false
      - key: CHANNEL_NAME
        value: antigravity
      # Render's internal address for the service above.
      - key: ANTIGRAVITY_URL
        value: http://antigravity-agent:8027/slack
